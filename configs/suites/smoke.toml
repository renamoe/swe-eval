# One task per benchmark; validates the full chain, not a score.
benchmarks = ["swebench", "tbv2"]
max_tokens = 8192
max_turns = 20
swe_agent_timeout = 900
swe_score_timeout = 1800
api_timeout = 300
swe_scoring = "submitted-only"
record_terminal_session = false

[manifests.swebench]
name = "smoke"
ids = ["astropy__astropy-12907"]

[manifests.tbv2]
name = "smoke"
ids = ["adaptive-rejection-sampler"]
